// Local-only browser export. File actions run from real DOM taps on mobile.
(() => {
  let closeCurrent = null;
  const words = {

  };

    const w = words[document.documentElement.lang?.startsWith('es') ? 'es' : 'en'];

    overlay.id = 'stats-export';
    const panel = document.createElement('section');
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');
    panel.setAttribute('aria-labelledby', 'stats-export-title');
    overlay.appendChild(panel);
    const title = document.createElement('h2');
    title.id = 'stats-export-title';
    title.textContent = w[0];
    panel.appendChild(title);
    const name = document.createElement('p');
    name.textContent = filename;
    panel.appendChild(name);
    const status = document.createElement('p');
    status.setAttribute('role', 'status');
    status.textContent = w[5];
    panel.appendChild(status);
    const actions = document.createElement('div');
    actions.className = 'export-actions';
    panel.appendChild(actions);
    const save = document.createElement('a');
    save.textContent = w[1];
    save.href = url;
    save.download = filename;
    save.onclick = () => { status.textContent = w[6]; };
    actions.appendChild(save);
    const file = typeof File === 'function' ? new File([blob], filename, { type: mime }) : null;
    const share = document.createElement('button');

        await navigator.share({ files: [file] });

        status.textContent = error.name === 'AbortError' ? w[8] : w[9];

    const copy = document.createElement('button');
    copy.textContent = w[3];
    actions.appendChild(copy);
    const close = document.createElement('button');
    close.textContent = w[4];
    actions.appendChild(close);
    const text = document.createElement('textarea');
    text.value = content;
    text.readOnly = true;
    text.rows = 5;
    text.setAttribute('aria-label', w[0]);
    panel.appendChild(text);
    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(content);
        status.textContent = w[10];
      } catch (_) {
        text.focus();
        text.select();
        text.setSelectionRange(0, content.length);
        status.textContent = w[11];
      }
    };
    const previousFocus = document.activeElement;
    function onKey(event) {
      if (event.key === 'Escape') { event.preventDefault(); closeDialog(); }
      if (event.key === 'Tab') {
        const controls = [save, share, copy, close, text].filter(node => !node.hidden && !node.disabled);

        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }

    let closed = false;

      if (closed) return;
      closed = true;

    closeCurrent = closeDialog;
